<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SubScan Sanal Galeri</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0c; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; top: 14px; left: 14px; display: flex; gap: 8px; z-index: 10; }
  button {
    background: rgba(20,20,24,0.85); color: #f0f0f0; border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px);
  }
  button:hover { background: rgba(40,40,46,0.9); }
  button.active { background: #3c3489; border-color: #7f77dd; }
  #hint {
    position: fixed; bottom: 14px; left: 14px; color: rgba(255,255,255,0.75); font-size: 12px;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px; z-index: 10; line-height: 1.5;
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,0.5); z-index: 10; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; background: #0a0a0c; color: #ccc; display: flex; align-items: center;
    justify-content: center; font-size: 14px; z-index: 20;
  }
  #joystick {
    position: fixed; left: 26px; bottom: 26px; width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); z-index: 15;
    touch-action: none; display: none;
  }
  #joystickKnob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.5);
  }
  @media (max-width: 700px), (pointer: coarse) {
    #ui {
      top: auto; left: 50%; right: auto; bottom: 14px; transform: translateX(-50%);
      flex-direction: column; align-items: center; gap: 10px;
    }
    #ui button {
      background: rgba(10,10,12,0.9); color: #ffffff; font-size: 36px; font-weight: 700;
      padding: 16px 26px; border: 1px solid rgba(255,255,255,0.4);
    }
    #ui button.active { background: #4a40b0; }
  }
</style>
</head>
<body>
<div id="loading">Sahne yükleniyor…</div>
<div id="crosshair"></div>
<div id="ui">
  <button id="tourBtn">Otomatik tur: başlat</button>
  <button id="musicBtn">Müzik: kapalı</button>
</div>
<div id="hint">Fareyi basılı tutup sürükle: bak &nbsp;·&nbsp; W A S D: yürü &nbsp;·&nbsp; Tekerlek: yakınlaş/uzaklaş</div>
<div id="joystick"><div id="joystickKnob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b32);
scene.fog = new THREE.Fog(0x2b2b32, 16, 34);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 6.5);

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || 'ontouchstart' in window;
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// ---------- room: one open gallery hall ----------
// Lambert (not Standard/PBR) for the big flat surfaces — same flat matte look,
// far cheaper per-light on mobile GPUs since these walls/floor/ceiling cover most of the screen.
const ROOM_W = 20, ROOM_D = 16, ROOM_H = 6;
const floorMat = new THREE.MeshLambertMaterial({ color: 0x1c1c20 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const wallMat = new THREE.MeshLambertMaterial({ color: 0x2a2a30 });
function wall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  scene.add(m);
}
wall(ROOM_W, ROOM_H, 0, ROOM_H/2, -ROOM_D/2, 0);          // back
wall(ROOM_W, ROOM_H, 0, ROOM_H/2, ROOM_D/2, Math.PI);      // front
wall(ROOM_D, ROOM_H, -ROOM_W/2, ROOM_H/2, 0, Math.PI/2);   // left
wall(ROOM_D, ROOM_H, ROOM_W/2, ROOM_H/2, 0, -Math.PI/2);   // right

const ceilMat = new THREE.MeshLambertMaterial({ color: 0xdedede });
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilMat);
ceil.position.set(0, ROOM_H, 0);
ceil.rotation.x = Math.PI/2;
scene.add(ceil);

// ---------- lighting: flat, even "room light switched on" — no dramatic pools ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.4));
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 0.5);
key.position.set(5, 8, 4);
scene.add(key);

// only 2 ceiling fill lights — ambient+hemisphere already carry the flat "lights on" look,
// these just break up the flatness a little without adding much per-fragment light-loop cost
function ceilingLight(x, z, intensity) {
  const p = new THREE.PointLight(0xfff4e0, intensity || 0.9, 20, 1);
  p.position.set(x, ROOM_H - 0.4, z);
  scene.add(p);
}
ceilingLight(0, 0, 1.0);
ceilingLight(0, -6, 0.8);

// wall torches: angled bracket + vertical stick + layered flame + flickering light
const torchLights = [];
function torch(x, z, ry) {
  const dir = new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry));
  const wallPoint = new THREE.Vector3(x, 3.5, z);
  const stickBase = wallPoint.clone().addScaledVector(dir, 0.3);

  const armDir = new THREE.Vector3(dir.x, 0.7, dir.z).normalize();
  const arm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.025, 0.34, 6),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.4 })
  );
  arm.position.copy(wallPoint).addScaledVector(armDir, 0.17);
  arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), armDir);
  scene.add(arm);

  const stick = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.045, 0.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a2a18, roughness: 0.9 })
  );
  stick.position.copy(stickBase).add(new THREE.Vector3(0, 0.22, 0));
  scene.add(stick);

  const flameBase = stickBase.clone().add(new THREE.Vector3(0, 0.47, 0));
  const outerFlame = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.22, 8), new THREE.MeshBasicMaterial({ color: 0xff7a1a }));
  outerFlame.position.copy(flameBase);
  scene.add(outerFlame);
  const innerFlame = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 8), new THREE.MeshBasicMaterial({ color: 0xffe066 }));
  innerFlame.position.copy(flameBase).add(new THREE.Vector3(0, 0.03, 0));
  scene.add(innerFlame);

  const light = new THREE.PointLight(0xff8c42, 1.1, 8, 1.5);
  light.position.copy(flameBase).add(new THREE.Vector3(0, 0.05, 0));
  scene.add(light);

  torchLights.push({ light, flame: outerFlame, flame2: innerFlame, base: 1.1, phase: Math.random() * 10 });
}
torch(-9.9, 4.5, Math.PI / 2);
torch(-9.9, -4.5, Math.PI / 2);
torch(9.9, 4.5, -Math.PI / 2);
torch(9.9, -4.5, -Math.PI / 2);
torch(-4.5, 7.95, Math.PI);
torch(4.5, 7.95, Math.PI);

// ---------- radargram frames ----------
const loader = new THREE.TextureLoader();
function frame(imgUrl, w, h, x, y, z, ry) {
  const group = new THREE.Group();
  const border = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.16, h + 0.16, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.6 })
  );
  group.add(border);
  const tex = loader.load(imgUrl);
  tex.colorSpace = THREE.SRGBColorSpace;
  const pic = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  pic.position.z = 0.05;
  group.add(pic);
  group.position.set(x, y, z);
  group.rotation.y = ry;
  group.castShadow = true;
  scene.add(group);
}
const D = ROOM_D/2 - 0.05, W = ROOM_W/2 - 0.05;
// radargram gallery: two rows so both image sets fit without crowding —
// bottom row = the live desktop-app screenshots, top row = the website gallery crops
const leftZ = [-6, -3.6, -1.2, 1.2, 3.6, 6];
const rightZ = [-6, -3, 3, 6];
const liveExt = (name) => name === 'live5' ? 'png' : 'webp';
const liveLeft = ['live1', 'live2', 'live3', 'live4', 'live5', 'live6'];
const liveRight = ['live7', 'live8', 'live9', 'live10'];
const siteLeft = ['radargram1', 'radargram5', 'radargram7', 'radargram9', 'radargram3', 'radargram2'];
const siteRight = ['radargram6', 'radargram8', 'radargram10', 'radargram4'];
leftZ.forEach((z, i) => {
  frame(`/sanal-galeri/assets/${liveLeft[i]}.${liveExt(liveLeft[i])}`, 1.3, 0.88, -W, 1.6, z, Math.PI/2);
  frame(`/sanal-galeri/assets/${siteLeft[i]}.png`, 1.3, 0.88, -W, 3.0, z, Math.PI/2);
});
rightZ.forEach((z, i) => {
  frame(`/sanal-galeri/assets/${liveRight[i]}.webp`, 1.3, 0.88, W, 1.6, z, -Math.PI/2);
  frame(`/sanal-galeri/assets/${siteRight[i]}.png`, 1.3, 0.88, W, 3.0, z, -Math.PI/2);
});

// the big new photo batch (51 shots) — spread across all four walls instead of one,
// at the same 1.3x0.88 size as the rest where there's an existing row to extend
const allNew = [{f:"p1.jpg",a:1.4048},{f:"p2.jpg",a:1.1036},{f:"p3.jpg",a:0.8536},{f:"p4.jpg",a:1.0017},{f:"p5.jpg",a:0.9411},{f:"p6.jpg",a:1.1571},{f:"p7.jpg",a:2.0823},{f:"p8.jpg",a:1.3429},{f:"p9.jpg",a:0.8857},{f:"p10.jpg",a:0.9107},{f:"p11.jpg",a:0.6268},{f:"p12.jpg",a:1.0839},{f:"p13.jpg",a:0.7179},{f:"p14.jpg",a:1.8251},{f:"p15.jpg",a:0.6482},{f:"p16.jpg",a:0.9321},{f:"p17.jpg",a:0.9625},{f:"p18.jpg",a:0.4502},{f:"p19.jpg",a:0.6268},{f:"p20.jpg",a:1.0982},{f:"p21.jpg",a:0.6268},{f:"p22.jpg",a:1.2946},{f:"p23.jpg",a:1.0942},{f:"p24.jpg",a:1.0017},{f:"p25.jpg",a:1.0982},{f:"p26.jpg",a:1.3429},{f:"p27.jpg",a:1.342},{f:"p28.jpg",a:1.3864},{f:"p29.jpg",a:1.1571},{f:"p30.jpg",a:1.0875},{f:"p31.jpg",a:1.3361},{f:"p32.jpg",a:0.7179},{f:"p33.jpg",a:1.5036},{f:"p34.jpg",a:0.7179},{f:"p35.jpg",a:1.719},{f:"p36.jpg",a:2.005},{f:"p37.jpg",a:1.719},{f:"p38.jpg",a:0.9286},{f:"p39.jpg",a:0.6268},{f:"p40.jpg",a:1.8071},{f:"p41.jpg",a:1.3429},{f:"p42.jpg",a:2.005},{f:"p43.jpg",a:1.1268},{f:"p44.jpg",a:1.8193},{f:"p45.jpg",a:1.2753},{f:"p46.jpg",a:0.8304},{f:"p47.jpg",a:1.0214},{f:"p48.jpg",a:1.3429},{f:"p49.jpg",a:0.6768},{f:"p50.jpg",a:0.9321},{f:"p51.jpg",a:0.9321}].map(x => ({ ...x, f: `p/${x.f}` }));

const left3rd = allNew.slice(0, 6);
const right3rd = allNew.slice(6, 10);
const backChunk = allNew.slice(10, 30);
const frontChunk = allNew.slice(30);

// left/right walls: a 3rd row, same fixed size as the rows already there
leftZ.forEach((z, i) => frame(`/sanal-galeri/assets/${left3rd[i].f}`, 1.3, 0.88, -W, 4.3, z, Math.PI/2));
rightZ.forEach((z, i) => frame(`/sanal-galeri/assets/${right3rd[i].f}`, 1.3, 0.88, W, 4.3, z, -Math.PI/2));

function layoutWall(images, targetH, gap, usableW, topY, minY, wallZ, ry) {
  function computeRows(H) {
    const rows = [];
    let row = [], rowW = 0;
    images.forEach(img => {
      const w = H * img.a;
      const addW = w + (row.length ? gap : 0);
      if (row.length && rowW + addW > usableW) { rows.push({ row, rowW }); row = []; rowW = 0; }
      row.push({ f: img.f, w, h: H });
      rowW += w + (row.length > 1 ? gap : 0);
    });
    if (row.length) rows.push({ row, rowW });
    return rows;
  }
  let H = targetH;
  let rows = computeRows(H);
  let totalH = rows.length * H + (rows.length - 1) * gap;
  const budget = topY - minY;
  if (totalH > budget) { H = H * (budget / totalH) * 0.96; rows = computeRows(H); }
  let y = topY - H / 2;
  rows.forEach(({ row, rowW }) => {
    let x = -rowW / 2;
    row.forEach(item => {
      frame(`/sanal-galeri/assets/${item.f}`, item.w, item.h, x + item.w / 2, y, wallZ, ry);
      x += item.w + gap;
    });
    y -= (H + gap);
  });
}

// back wall: the 3 existing annotated shots plus a fair share of the new batch,
// landscape and portrait kept in their own bands
const backImgs = [{ f: 'a1.jpg', a: 1.719 }, { f: 'a2.jpg', a: 1.719 }, { f: 'a3.jpg', a: 1.719 }, ...backChunk];
layoutWall(backImgs.filter(i => i.a >= 1), 0.85, 0.4, 18, 5.4, 3.1, -D, 0);
layoutWall(backImgs.filter(i => i.a < 1), 0.85, 0.4, 18, 2.9, 1.0, -D, 0);

// front (entrance) wall: the rest of the new batch, same landscape/portrait split
layoutWall(frontChunk.filter(i => i.a >= 1), 0.85, 0.4, 18, 5.0, 2.7, D, Math.PI);
layoutWall(frontChunk.filter(i => i.a < 1), 0.85, 0.4, 18, 2.5, 1.0, D, Math.PI);

// ---------- pedestal ----------
const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(1.1, 1.2, 0.5, 32),
  new THREE.MeshStandardMaterial({ color: 0x3c3c42, roughness: 0.6 })
);
pedestal.position.set(0, 0.25, 0);
pedestal.castShadow = true; pedestal.receiveShadow = true;
scene.add(pedestal);

// ---------- centerpiece: the sarcophagus itself, no container box around it ----------
const diorama = new THREE.Group();
diorama.position.set(0, 0.5, 0);
scene.add(diorama);

// centerpiece: procedural stone sarcophagus (lahit) with a carved lid
function stoneNoiseTexture(base, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < (w * h) / 6; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const shade = Math.random() < 0.5 ? 'rgba(0,0,0,' : 'rgba(255,255,255,';
    ctx.fillStyle = shade + (Math.random() * 0.08) + ')';
    ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  return new THREE.CanvasTexture(c);
}
function reliefTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 384;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#514f47'; ctx.fillRect(0, 0, 256, 384);
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * 256, y = Math.random() * 384;
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.06)';
    ctx.fillRect(x, y, 2, 2);
  }
  function groove(x0, y0, x1, y1, width) {
    ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = Math.max(1, width - 3);
    ctx.beginPath(); ctx.moveTo(x0 + 1.5, y0 + 1.5); ctx.lineTo(x1 + 1.5, y1 + 1.5); ctx.stroke();
  }
  groove(16, 16, 240, 16, 6); groove(240, 16, 240, 368, 6);
  groove(240, 368, 16, 368, 6); groove(16, 368, 16, 16, 6);
  groove(34, 34, 222, 34, 4); groove(222, 34, 222, 350, 4);
  groove(222, 350, 34, 350, 4); groove(34, 350, 34, 34, 4);
  groove(128, 60, 128, 324, 4);
  groove(60, 192, 196, 192, 4);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(128, 192, 46, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(129.5, 193.5, 46, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    groove(128 + Math.cos(a) * 20, 192 + Math.sin(a) * 20, 128 + Math.cos(a) * 44, 192 + Math.sin(a) * 44, 2);
  }
  return new THREE.CanvasTexture(c);
}
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneNoiseTexture('#5c5a51', 128, 128), color: 0x8c897c, roughness: 1 });
const lidMat = new THREE.MeshStandardMaterial({ color: 0xa8a598, roughness: 0.95, map: reliefTexture() });
const sarcophagus = new THREE.Group();
const sarcBase = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.75), stoneMat);
sarcBase.position.y = 0.25;
sarcBase.castShadow = true; sarcBase.receiveShadow = true;
sarcophagus.add(sarcBase);
const sarcLid = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.16, 0.82), lidMat);
sarcLid.position.set(0.08, 0.58, -0.03);
sarcLid.rotation.z = 0.04;
sarcLid.castShadow = true; sarcLid.receiveShadow = true;
sarcophagus.add(sarcLid);
sarcophagus.rotation.y = 0.2;
diorama.add(sarcophagus);

// standing exhibits: downloaded low-poly statues (CC-BY, poly.pizza), placed in the room's back corners
const gltfLoader = new THREE.GLTFLoader();
function loadStatue(url, x, z, targetHeight, faceY) {
  gltfLoader.load(url, (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); box.getSize(size);
    const scale = targetHeight / Math.max(size.y, 0.001);
    model.scale.setScalar(scale);
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.x -= (box2.min.x + box2.max.x) / 2;
    model.position.z -= (box2.min.z + box2.max.z) / 2;
    model.position.y -= box2.min.y;
    model.rotation.y = faceY;
    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.6, 0.3, 24),
      new THREE.MeshStandardMaterial({ color: 0x3c3c42, roughness: 0.6 })
    );
    pedestal.position.set(x, 0.15, z);
    pedestal.castShadow = true; pedestal.receiveShadow = true;
    scene.add(pedestal);
    model.position.x += x;
    model.position.y += 0.3;
    model.position.z += z;
    model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(model);
  }, undefined, (err) => console.error('statue load failed', url, err));
}
const CORNER_X = 8.7, CORNER_Z = -6.7;
// face the sarcophagus at the room center (0,0): yaw = atan2(x - targetX, z - targetZ)
function faceToward(x, z, tx, tz) { return Math.atan2(x - tx, z - tz); }
loadStatue('/sanal-galeri/assets/knight-statue.glb', -CORNER_X, CORNER_Z, 1.8, faceToward(-CORNER_X, CORNER_Z, 0, 0) + Math.PI);

// ---------- entrance marker ----------
const marker = new THREE.Mesh(
  new THREE.RingGeometry(0.5, 0.6, 32),
  new THREE.MeshBasicMaterial({ color: 0x7f77dd, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
);
marker.rotation.x = -Math.PI/2;
marker.position.set(0, 0.02, 6.2);
scene.add(marker);

document.getElementById('loading').style.display = 'none';

// ---------- first-person look + move ----------
let yaw = 0, pitch = 0;
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging || tourActive) return;
  yaw -= (e.clientX - lastX) * 0.0035;
  pitch -= (e.clientY - lastY) * 0.0035;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('touchstart', e => { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive:true});
renderer.domElement.addEventListener('touchend', () => dragging = false);
renderer.domElement.addEventListener('touchmove', e => {
  if (!dragging || tourActive) return;
  yaw -= (e.touches[0].clientX - lastX) * 0.0035;
  pitch -= (e.touches[0].clientY - lastY) * 0.0035;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, {passive:true});

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---------- mobile: on-screen joystick for walking ----------
let joyX = 0, joyZ = 0;
if ('ontouchstart' in window) {
  const joy = document.getElementById('joystick');
  const knob = document.getElementById('joystickKnob');
  joy.style.display = 'block';
  document.getElementById('hint').textContent = 'Parmağını ekranda sürükle: bak · Sol alttaki joystick: yürü';
  let joyTouchId = null, joyCenter = { x: 0, y: 0 };
  const JOY_RADIUS = 40;
  joy.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    const rect = joy.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyTouchId) continue;
      let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
      const dist = Math.min(Math.hypot(dx, dy), JOY_RADIUS);
      const ang = Math.atan2(dy, dx);
      dx = Math.cos(ang) * dist; dy = Math.sin(ang) * dist;
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyX = dx / JOY_RADIUS; joyZ = dy / JOY_RADIUS;
    }
  }, { passive: true });
  window.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyTouchId) continue;
      joyTouchId = null; joyX = 0; joyZ = 0;
      knob.style.transform = 'translate(0px, 0px)';
    }
  }, { passive: true });
}

renderer.domElement.addEventListener('wheel', e => {
  camera.fov = Math.max(40, Math.min(80, camera.fov + e.deltaY * 0.02));
  camera.updateProjectionMatrix();
}, {passive:true});

const MARGIN = 1;
function clampToRoom(v) {
  v.x = Math.max(-ROOM_W/2 + MARGIN, Math.min(ROOM_W/2 - MARGIN, v.x));
  v.z = Math.max(-ROOM_D/2 + MARGIN, Math.min(ROOM_D/2 - MARGIN, v.z));
  return v;
}

// ---------- auto tour ----------
const waypoints = [
  { pos: [0, 1.7, 6.2],    look: [0, 1.6, 0] },
  // walk the full length of the left wall so every frame (both rows) passes into view
  { pos: [-5.5, 1.9, 6],   look: [-9.9, 2.2, 6] },
  { pos: [-5.5, 1.9, 1.5], look: [-9.9, 2.2, 1.5] },
  { pos: [-5.5, 1.9, -2.5],look: [-9.9, 2.2, -2.5] },
  { pos: [-5.5, 1.9, -6.5],look: [-9.9, 2.2, -6.5] },
  // sarcophagus
  { pos: [0, 1.9, 2.2],    look: [0, 0.8, 0] },
  // walk the full length of the right wall
  { pos: [5.5, 1.9, 6],    look: [9.9, 2.2, 6] },
  { pos: [5.5, 1.9, 1],    look: [9.9, 2.2, 1] },
  { pos: [5.5, 1.9, -3],   look: [9.9, 2.2, -3] },
  { pos: [5.5, 1.9, -6.5], look: [9.9, 2.2, -6.5] },
  // knight, then the back wall (3 more frames), then exit past the sarcophagus
  { pos: [-5.5, 1.6, -5],  look: [-8.7, 1.6, -6.7] },
  { pos: [0, 2.0, -4],     look: [0, 2.2, -7.95] },
  { pos: [0, 1.7, -6],     look: [0, 0.9, 0] },
];
let tourActive = false, tourIdx = 0, tourT = 0;
const tourBtn = document.getElementById('tourBtn');
tourBtn.onclick = () => {
  tourActive = !tourActive;
  tourBtn.textContent = tourActive ? 'Otomatik tur: durdur' : 'Otomatik tur: başlat';
  tourBtn.classList.toggle('active', tourActive);
  tourIdx = 0; tourT = 0;
};

// ---------- ambient music: real "Ancient Egypt" track (Pixabay, royalty-free) ----------
let musicOn = false;
const musicBtn = document.getElementById('musicBtn');
const musicEl = new Audio('/sanal-galeri/assets/ancient-egypt.mp3');
musicEl.loop = true;
musicEl.volume = 0.7;
musicBtn.onclick = () => {
  musicOn = !musicOn;
  musicBtn.textContent = musicOn ? 'Müzik: açık' : 'Müzik: kapalı';
  musicBtn.classList.toggle('active', musicOn);
  if (musicOn) musicEl.play(); else musicEl.pause();
};

// ---------- animation loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();
  diorama.rotation.y = Math.sin(elapsed * 0.18) * 0.6;
  torchLights.forEach(t => {
    const flicker = Math.sin(elapsed * 9 + t.phase) * 0.15 + Math.sin(elapsed * 23 + t.phase) * 0.08;
    t.light.intensity = t.base + flicker;
    t.flame.scale.setScalar(1 + flicker * 0.3);
    t.flame2.scale.setScalar(1 + flicker * 0.4);
  });

  if (tourActive) {
    tourT += dt * 0.25;
    if (tourT >= 1) { tourT = 0; tourIdx = (tourIdx + 1) % waypoints.length; }
    const a = waypoints[tourIdx], b = waypoints[(tourIdx+1) % waypoints.length];
    const ease = tourT*tourT*(3-2*tourT);
    camera.position.set(
      a.pos[0] + (b.pos[0]-a.pos[0])*ease,
      a.pos[1] + (b.pos[1]-a.pos[1])*ease,
      a.pos[2] + (b.pos[2]-a.pos[2])*ease
    );
    const lookX = a.look[0] + (b.look[0]-a.look[0])*ease;
    const lookY = a.look[1] + (b.look[1]-a.look[1])*ease;
    const lookZ = a.look[2] + (b.look[2]-a.look[2])*ease;
    camera.lookAt(lookX, lookY, lookZ);
  } else {
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const speed = 3.2 * dt;
    const next = camera.position.clone();
    if (keys['w'] || keys['arrowup']) next.addScaledVector(forward, speed);
    if (keys['s'] || keys['arrowdown']) next.addScaledVector(forward, -speed);
    if (keys['a'] || keys['arrowleft']) next.addScaledVector(right, -speed);
    if (keys['d'] || keys['arrowright']) next.addScaledVector(right, speed);
    if (joyX || joyZ) {
      next.addScaledVector(forward, -joyZ * speed);
      next.addScaledVector(right, joyX * speed);
    }
    camera.position.copy(clampToRoom(next));
    const lookDir = new THREE.Vector3(
      -Math.sin(yaw) * Math.cos(pitch),
      Math.sin(pitch),
      -Math.cos(yaw) * Math.cos(pitch)
    );
    camera.lookAt(camera.position.clone().add(lookDir));
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
